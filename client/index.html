<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Loaded as HTML <link> tags (not a CSS @import, which is always
      render-blocking) so a slow/unreachable Google Fonts CDN never leaves
      the whole page blank — media="print" makes the browser fetch it
      without blocking screen rendering, then the onload swap applies it
      once it's actually ready. If it never loads, the page still renders
      fine with its fallback fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LUNAダッシュボード" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>LUNAレンタルサロン 店舗運営ダッシュボード</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
